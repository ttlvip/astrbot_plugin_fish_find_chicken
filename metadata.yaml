name: astrbot_plugin_fish_find_chicken
display_name: 鱼鱼找鸡
short_desc: 给一张图，反查这人是哪个 coser、账号在哪
desc: 引用一张图发 /鱼鱼找鸡，用谷歌 Lens 反查原帖，认出是哪个 coser 并给出 X、微博、B站、Instagram、小红书等账号；同时并发 SauceNAO / trace.moe / IQDB 作为补充。纯 Python 实现（自带 CDP 浏览器驱动，不依赖 Node），支持复用 AstrBot 全局 http_proxy 访问谷歌；可选用 browser_region=auto 把浏览器时区/语言对齐出口 IP，减少人机验证。
version: 0.1.3
author: ttlvip
repo: "https://github.com/ttlvip/astrbot_plugin_fish_find_chicken"
astrbot_version: ">=4.5"
support_platforms:
  - aiocqhttp
  - telegram
  - discord
  - lark
